name = "dotenv"
grammar = "dotenv"
path_suffixes = [
    ".flaskenv",
    ".env",
    ".env-sample",
    ".env.example",
    ".env.local",
    ".env.dev",
    ".env.dev.local",
    ".env.build",
    ".env.build.local",
    ".env.development",
    ".env.development.local",
    ".env.test",
    ".env.test.local",
    ".env.testing",
    ".env.qa",
    ".env.qa.local",
    ".env.uat",
    ".env.uat.local",
    ".env.stag",
    ".env.stag.local",
    ".env.stage",
    ".env.stage.local",
    ".env.staging",
    ".env.staging.local",
    ".env.live",
    ".env.live.local",
    ".env.production",
    ".env.production.local",
    ".env.prod",
    ".env.prod.local",
]
line_comments = ["# "]
autoclose_before = ";:.,=}])>"
brackets = [
    { start = "{", end = "}", close = true, newline = false },
    { start = "[", end = "]", close = true, newline = false },
    { start = "(", end = ")", close = true, newline = false },
    { start = "\"", end = "\"", close = true, newline = false, not_in = ["string"] },
    { start = "'", end = "'", close = true, newline = false, not_in = ["string"] },
]
